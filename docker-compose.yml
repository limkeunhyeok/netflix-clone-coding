version: '3.7'

services:
  postgres:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: netflix
    expose:
      - 5432
    ports:
      - 5432:5432
    restart: 'unless-stopped'

  adminer:
    image: adminer
    restart: always
    ports:
      - 8888:8080
